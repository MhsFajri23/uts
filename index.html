<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Pernikahan</title>
    
    <link rel="stylesheet" href="landing.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 text-white m-0">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="glass-card p-5 text-center shadow-lg">
                    <h1 class="display-4 mb-3 fst-italic">Menuju Hari Bahagia</h1>
                    <p class="lead mb-5 fw-light">Kami tidak sabar untuk merayakan momen ini bersama Anda</p>

                    <!-- Area Hitung Mundur -->
                    <div class="d-flex justify-content-center flex-wrap gap-3 mb-5">
                        <div class="time-box bg-dark bg-opacity-50 p-3 rounded text-center">
                            <span id="days" class="fs-1 fw-bold d-block">25</span>
                            <small class="text-uppercase tracking-wider">Hari</small>
                        </div>
                        <div class="time-box bg-dark bg-opacity-50 p-3 rounded text-center">
                            <span id="hours" class="fs-1 fw-bold d-block">00</span>
                            <small class="text-uppercase tracking-wider">Jam</small>
                        </div>
                        <div class="time-box bg-dark bg-opacity-50 p-3 rounded text-center">
                            <span id="minutes" class="fs-1 fw-bold d-block">00</span>
                            <small class="text-uppercase tracking-wider">Menit</small>
                        </div>
                        <div class="time-box bg-dark bg-opacity-50 p-3 rounded text-center">
                            <span id="seconds" class="fs-1 fw-bold d-block">00</span>
                            <small class="text-uppercase tracking-wider">Detik</small>
                        </div>
                    </div>

                    <a href="landing-page.html" class="btn btn-gold btn-lg rounded-pill px-5 fw-bold shadow">
                        Buka Undangan
                    </a>
                </div>
            </div>
        </div>
    </div>



    
     <script src="landing.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>
